[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-impact"
version = "0.1.0"
description = "Reproducibility artifact for patch-grounded software change impact analysis."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7",
]

[project.scripts]
change-impact = "change_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
