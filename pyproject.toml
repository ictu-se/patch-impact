[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-impact"
version = "0.1.0"
description = "Leakage-aware evaluation of patch-grounded software change reports."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
]

[project.scripts]
change-impact = "change_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
